services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NServiceBus!1"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "NServiceBus!1" -C -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sql-server:
        condition: service_healthy
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command: -S sql-server -U sa -P "NServiceBus!1" -C -Q "IF DB_ID('nservicebus') IS NULL CREATE DATABASE nservicebus"

  # ── VS Code Dev Container ──────────────────────────────────────────────
  # Source is mounted live (not copied), so edits are reflected immediately.
  # VS Code opens into this container via .devcontainer/devcontainer.json.
  # SQL Server is NOT started by default; bring it up separately when needed:
  #   docker compose up -d sql-server db-init
  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: sleep infinity
    environment:
      SQLServerConnectionString: "Server=sql-server;Initial Catalog=nservicebus;User Id=sa;Password=NServiceBus!1;TrustServerCertificate=True;Encrypt=False"

  # ── Issue #959 regression test (no SQL Server required) ────────────────
  # Runs ONLY the #959 regression test. It compiles the NHibernate mappings
  # in memory and never opens a database connection, so the only dependency
  # is Docker itself — no SQL Server container, no local .NET SDK.
  #
  # Usage:  docker compose run --build issue-959-test
  issue-959-test:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--filter"
      - "FullyQualifiedName~When_configuration_contains_non_saga_collection_mappings"

  # ── Full unit / integration test suite (requires SQL Server) ───────────
  # Spins up a containerized SQL Server, so no local SQL install is needed.
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SQLServerConnectionString: "Server=sql-server;Initial Catalog=nservicebus;User Id=sa;Password=NServiceBus!1;TrustServerCertificate=True;Encrypt=False"

  # Tests against your host machine's SQL Server
  # Usage: docker compose run tests-local-sql
  tests-local-sql:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SQLServerConnectionString: "Server=host.docker.internal;Initial Catalog=nservicebus;User Id=sa;Password=YourPassword;TrustServerCertificate=True;Encrypt=False"
    profiles:
      - local-sql

  # ── Issue #959 bug reproduction endpoint ──────────────────────────────
  # Runs the NServiceBus endpoint from the gist that triggers the bug.
  # With the fix applied, prints SUCCESS. Without the fix, prints FAILURE.
  #
  # Self-contained:  docker compose up repro-endpoint
  # Local SQL:       docker compose run repro-endpoint-local-sql
  repro-endpoint:
    build:
      context: .
      dockerfile: Dockerfile.repro
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SQLServerConnectionString: "Server=sql-server;Initial Catalog=nservicebus;User Id=sa;Password=NServiceBus!1;TrustServerCertificate=True;Encrypt=False"

  # Repro endpoint pointed at your host's SQL Server
  repro-endpoint-local-sql:
    build:
      context: .
      dockerfile: Dockerfile.repro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SQLServerConnectionString: "Server=host.docker.internal;Initial Catalog=nservicebus;User Id=sa;Password=YourPassword;TrustServerCertificate=True;Encrypt=False"
    profiles:
      - local-sql
